// Apply Scala plugin if not already applied (GregTech buildscript checks wrong location)
if (!project.plugins.hasPlugin('scala')) {
    apply plugin: 'scala'
}

def jarVer = "${project.minecraftVersion}-${project.modVersion}"

// Configure source sets for Project Red's non-standard layout
sourceSets {
    main {
        def root = project.projectDir
        scala {
            srcDir new File(root, "src")
        }
        resources {
            srcDir new File(root, "resources")
        }
    }
}

// Configure processResources to expand variables in .info files
processResources {
    // Expand variables in all .info files (matching old build.gradle.old behavior)
    filesMatching('**.info') {
        expand(
            'mod_version': modVersion,
            'mc_version': minecraftVersion,
            'forge_version': project.ext.config.forge_version,
            'tjcore_version': project.ext.config.tjpcore_version.replace(".+", ""),  // Note: tjcore in template, tjpcore in properties
            'ccl_version': project.ext.config.ccl_version.replace(".+", ""),
            'fmp_version': project.ext.config.fmp_version.replace(".+", "")
        )
    }
}

// Enable experimental features for Scala compiler (required by Project Red)
tasks.withType(ScalaCompile) {
    scalaCompileOptions.additionalParameters = ["-Xexperimental"]
    scalaCompileOptions.deprecation = false
}

// Extension properties for jar versioning
ext.jarVer = "${minecraftVersion}-${version}"
ext.baseExcludes = ["**/dan200/**", "**/coloredlightscore/**"]

// Helper to get jar file - will be evaluated lazily
ext.getJarFile = {
    zipTree(tasks.reobfJar.archiveFile.get().asFile)
}

ext.configFile = file "build.properties"
configFile.withReader {
    // Load config.  It shall from now be referenced as simply config or project.config
    def prop = new Properties()
    prop.load(it)
    project.ext.config = new ConfigSlurper().parse prop
}

// Integration Jar - Contains integration and transmission modules
tasks.register('integrationJar', Jar) {
    dependsOn tasks.reobfJar

    from(project.ext.getJarFile) {
        def patterns = [
            "**/ProjectRedIntegration*.class",
            "**/ProjectRedTransmission*.class",
            "**/mrtjp/projectred/integration/**",
            "**/mrtjp/projectred/transmission/**",
            "**/assets/projectred/textures/blocks/integration/**",
            "**/assets/projectred/textures/obj/integration/**",
            "**/assets/projectred-integration/recipes/**",
            "**/assets/projectred-transmission/recipes/**",
            "integration_mod.info"
        ]

        include patterns
        rename "integration_mod.info", "mcmod.info"

        // Track what we've included for base jar exclusion
        project.ext.baseExcludes.addAll(patterns)
    }

    archiveVersion = jarVer
    archiveClassifier = "integration"
}

