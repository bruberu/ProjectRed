            "**/assets/projectred/textures/blocks/world/**",
            "**/assets/projectred/textures/items/world/**",
            "**/assets/projectred-exploration/recipes/**",
            "world_mod.info"
        ]

        include patterns
        rename "world_mod.info", "mcmod.info"

        project.ext.baseExcludes.addAll(patterns)
