// Base Jar - Contains everything not in other jars
tasks.register('baseJar', Jar) {
    dependsOn tasks.reobfJar

    from(project.ext.getJarFile) {
        exclude project.ext.baseExcludes
        rename "base_mod.info", "mcmod.info"
    }

    archiveVersion = jarVer
    archiveClassifier = "Base"
}

// Ensure base jar runs last since it excludes everything from other jars
tasks.named('baseJar').configure {
    mustRunAfter tasks.integrationJar, tasks.fabricationJar, tasks.lightingJar,
                 tasks.mechanicalJar, tasks.worldJar, tasks.compatJar
}

// Disable empty directories in all jars
tasks.withType(Jar) {
    includeEmptyDirs = false
}

// Add all submod jars as artifacts
artifacts {
    archives tasks.integrationJar
    archives tasks.fabricationJar
    archives tasks.lightingJar
    archives tasks.mechanicalJar
    archives tasks.worldJar
    archives tasks.compatJar
    archives tasks.baseJar
}
