            "**/mrtjp/projectred/fabrication/**",
            "**/assets/projectred/cc_blockstates/fabrication/**",
            "**/assets/projectred/textures/blocks/fabrication/**",
            "**/assets/projectred/textures/items/fabrication/**",
            "**/assets/projectred/textures/obj/fabrication/**",
            "**/assets/projectred-fabrication/recipes/**",
            "fabrication_mod.info"
        ]

        include patterns
