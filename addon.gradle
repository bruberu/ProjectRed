// Compat Jar - Contains compatibility module
tasks.register('compatJar', Jar) {
    dependsOn tasks.reobfJar

    from(project.ext.getJarFile) {
        def patterns = [
            "**/ProjectRedCompatibility*.class",
            "**/mrtjp/projectred/compatibility/**",
            "**/assets/projectred/textures/blocks/compat/**",
            "compat_mod.info"
        ]

