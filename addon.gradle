// Mechanical Jar - Contains expansion, transportation, and relocation modules
tasks.register('mechanicalJar', Jar) {
    dependsOn tasks.reobfJar

    from(project.ext.getJarFile) {
        def patterns = [
            "**/ProjectRedExpansion*.class",
            "**/mrtjp/projectred/expansion/**",
            "**/ProjectRedTransportation*.class",
            "**/mrtjp/projectred/transportation/**",
            "**/ProjectRedRelocation*.class",
            "**/mrtjp/projectred/relocation/**",
            "**/assets/projectred/cc_blockstates/mechanical/**",
            "**/assets/projectred/textures/blocks/mechanical/**",
            "**/assets/projectred/textures/items/mechanical/**",
            "**/assets/projectred/textures/obj/mechanical/**",
            "**/assets/projectred-expansion/recipes/**",
            "**/assets/projectred-transportation/recipes/**",
            "**/assets/projectred-relocation/recipes/**",
            "mechanical_mod.info",
            "**/projectred-relocation_at.cfg"
        ]

        include patterns
        rename "mechanical_mod.info", "mcmod.info"

        project.ext.baseExcludes.addAll(patterns)
    }

    manifest {
        attributes "FMLAT": "projectred-relocation_at.cfg"
    }

    archiveVersion = jarVer
    archiveClassifier = "mechanical"
}

